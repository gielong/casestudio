name: Deploy PR Preview

on:
  push:
    branches-ignore: [master]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  preview:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}preview/${{ github.ref_name }}/
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production
        uses: actions/checkout@v4
        with:
          ref: master
          path: production

      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          path: preview

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            production/frontend/package-lock.json
            preview/frontend/package-lock.json

      - name: Build production
        working-directory: production/frontend
        run: |
          npm ci
          npm run build

      - name: Build PR preview
        working-directory: preview/frontend
        env:
          VITE_BASE_PATH: /casestudio/preview/${{ github.ref_name }}/
        run: |
          npm ci
          npm run build

      - name: Assemble Pages artifact
        run: |
          mkdir -p site/preview/${{ github.ref_name }}
          cp -R production/frontend/dist/. site/
          cp -R preview/frontend/dist/. site/preview/${{ github.ref_name }}/

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy preview
        id: deployment
        uses: actions/deploy-pages@v4
