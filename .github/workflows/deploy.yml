name: Deploy to GitHub Pages
# Publishes production plus the current feature/er-submodels preview. Refresh: unified submodel dropdown..

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production
        uses: actions/checkout@v4
        with:
          path: production

      - name: Checkout UI preview branch
        uses: actions/checkout@v4
        with:
          ref: feature/er-submodels
          path: preview

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            production/frontend/package-lock.json
            preview/frontend/package-lock.json

      - name: Build production
        run: |
          npm ci
          npm run build
        working-directory: production/frontend

      - name: Build UI preview
        run: |
          npm ci
          npm run build
        working-directory: preview/frontend
        env:
          VITE_BASE_PATH: /casestudio/preview/feature/er-submodels/

      - name: Assemble site
        run: |
          mkdir -p site/preview/feature/er-submodels
          cp -R production/frontend/dist/. site/
          cp -R preview/frontend/dist/. site/preview/feature/er-submodels/

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
